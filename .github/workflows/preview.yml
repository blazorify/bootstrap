name: preview

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish Preview Package
    runs-on: ubuntu-latest

    # id-token lets the job exchange a GitHub OIDC token for a short-lived NuGet key.
    # Naming any permission drops the rest to none, so contents is restated for checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Generate Preview Version
        id: version
        run: |
          TIMESTAMP=$(date -u +"%y%m%d%H%M%S")
          echo "VERSION=1.0.0-preview.$TIMESTAMP" >> $GITHUB_ENV

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build the Project
        run: dotnet build --configuration Release /p:Version=${{ env.VERSION }}

      - name: Pack NuGet Package
        run: dotnet pack --configuration Release --output ./artifacts /p:Version=${{ env.VERSION }}

      # The key is valid for an hour and single-use, so it is requested right before the push.
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
