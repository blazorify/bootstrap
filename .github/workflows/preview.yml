name: preview

on:
  push:
    branches:
      - dev

jobs:
  build-and-publish:
    name: Build and Publish Preview Package
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      # Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore

      # Build the project with Preview configuration
      - name: Build the Project
        run: dotnet build --configuration Preview

      # Pack the NuGet package
      - name: Pack NuGet Package
        run: dotnet pack --configuration Preview --output ./artifacts
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # Publish to NuGet
      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
